<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>餅マップ v0.9.4</title>
<link rel="stylesheet" href="style.css?v=0911-fix12">
</head>
<body>
<div id="wrap">
<svg id="stage" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="outerShadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/><feOffset in="blur" dx="0" dy="5" result="off"/><feComponentTransfer in="off" result="fade"><feFuncA type="linear" slope="0.20"/></feComponentTransfer><feMerge><feMergeNode in="fade"/></feMerge></filter>
    <filter id="overlapShadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feComponentTransfer in="off" result="fade"><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode in="fade"/></feMerge></filter>
  </defs>
  <g id="world"><g id="shadowLayer" filter="url(#outerShadow)"></g><g id="linksLayer"></g><g id="mergeLayer"></g><g id="liveLayer"></g><g id="overlapLayer"></g><g id="nodesLayer"></g><g id="hiddenLayer"></g><g id="inkLayer"></g><g id="uiLayer"></g></g>
</svg>
<div id="status">餅マップ v0.9.4<br>BUILD 0911-FIX12<br>待機中</div>
<div id="controls" aria-label="操作ツールバー">
  <button id="undoBtn" disabled aria-label="戻る" title="戻る"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M5 12h7a6 6 0 0 1 6 6"/></svg></button>
  <button id="redoBtn" disabled aria-label="進む" title="進む"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5"/><path d="M19 12h-7a6 6 0 0 0-6 6"/></svg></button>
  <button id="fitBtn" aria-label="全体表示" title="全体表示"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M4 16v4h4M20 16v4h-4"/></svg></button>
  <button id="selectBtn" aria-label="選択" title="選択"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l5.4 14 2.1-5.1L19 10.8 6 4Z"/></svg></button>
  <button id="newBtn" aria-label="新規丸" title="新規丸"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="12" r="6"/><path d="M18 6v6M15 9h6"/></svg></button>
  <button id="linkBtn" aria-label="紐付け" title="紐付け"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/><path d="M7.5 12c3-4 6-4 9 0"/></svg></button>
  <button id="detachBtn" aria-label="分離" title="分離"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="12" r="3"/><path d="m10 9-3 3 3 3M14 9l3 3-3 3"/></svg></button>
  <button id="eraseBtn" aria-label="削除" title="削除"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 17-3-3 8-8 5 5-6 6H8Z"/><path d="M12 17h7"/></svg></button>
</div>
<div id="contextMenu"><button id="ctxSelect">選択</button><button id="ctxNew">新規丸</button><button id="ctxDelete">削除</button><button id="ctxLink">紐付け（仮）</button><button id="ctxDetach">分離</button></div>
<div id="confirmDelete"><div class="msg" id="deleteMsg"></div><div class="actions"><button id="cancelDelete">キャンセル</button><button id="doDelete" class="danger">削除</button></div></div>
<div id="help">Pencil：丸移動／外縁から紐伸ばし／丸同士の迎え半円が触れたら離して接着／そのまま進むと重なり</div>
</div>
