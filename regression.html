<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>餅マップ 回帰テスト FIX11</title>
<link rel="stylesheet" href="style.css?v=0911-fix11">
<style>
#regressionPanel{position:fixed;top:10px;right:10px;z-index:20000;width:min(430px,46vw);max-height:calc(100vh - 20px);overflow:auto;background:rgba(255,255,255,.96);padding:12px;border-radius:14px;box-shadow:0 6px 26px rgba(0,0,0,.18);font-size:12px;line-height:1.35}
#regressionPanel h2{margin:0 0 8px;font-size:16px}#regressionResults{display:grid;gap:3px;margin-bottom:10px}.pass{color:#234}.fail{color:#a22;font-weight:700}#scenarioButtons{display:flex;flex-wrap:wrap;gap:5px}#scenarioButtons button{font-size:11px;padding:6px 8px}
@media(max-width:760px){#regressionPanel{width:calc(100vw - 20px);max-height:36vh}}
</style>
</head>
<body>
<div id="wrap">
<svg id="stage" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="outerShadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/><feOffset in="blur" dx="0" dy="5" result="off"/><feComponentTransfer in="off" result="fade"><feFuncA type="linear" slope="0.20"/></feComponentTransfer><feMerge><feMergeNode in="fade"/></feMerge></filter>
    <filter id="overlapShadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feComponentTransfer in="off" result="fade"><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode in="fade"/></feMerge></filter>
  </defs>
  <g id="world"><g id="shadowLayer" filter="url(#outerShadow)"></g><g id="linksLayer"></g><g id="mergeLayer"></g><g id="liveLayer"></g><g id="overlapLayer"></g><g id="nodesLayer"></g><g id="hiddenLayer"></g><g id="inkLayer"></g><g id="uiLayer"></g></g>
</svg>
<div id="status">餅マップ v0.9.4<br>BUILD 0911-FIX11 TEST<br>待機中</div>
<div id="controls"><button id="undoBtn" disabled>↶ 戻る</button><button id="redoBtn" disabled>↷ 進む</button><button id="selectBtn">選択</button><button id="eraseBtn">消しゴム</button><button id="newBtn">新規丸</button><button id="linkBtn">紐付け（仮）</button><button id="fitBtn">全体表示</button></div>
<div id="contextMenu"><button id="ctxSelect">選択</button><button id="ctxNew">新規丸</button><button id="ctxDelete">削除</button><button id="ctxLink">紐付け（仮）</button><button id="ctxDetach">分離</button></div>
<div id="confirmDelete"><div class="msg" id="deleteMsg"></div><div class="actions"><button id="cancelDelete">キャンセル</button><button id="doDelete" class="danger">削除</button></div></div>
<div id="help">回帰テスト専用。通常版とは別ページです。</div>
</div>
<div id="regressionPanel"><h2>回帰テスト実行中</h2><div id="regressionResults"></div><strong>再現シーン</strong><div id="scenarioButtons"></div></div>
<script src="app-core.js?v=0911-fix11"></script>
<script src="app-render.js?v=0911-fix11"></script>
<script src="app-gesture.js?v=0911-fix11"></script>
<script src="app-ui.js?v=0911-fix11"></script>
<script src="app-fix6.js?v=0911-fix11"></script>
<script src="app-fix7.js?v=0911-fix11"></script>
<script src="app-fix8.js?v=0911-fix11"></script>
<script src="app-fix9.js?v=0911-fix11"></script>
<script src="app-fix10.js?v=0911-fix11"></script>
<script src="app-fix11.js?v=0911-fix11"></script>
<script src="app-regression.js?v=0911-fix11"></script>
</body>
</html>
